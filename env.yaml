name: dlhook_env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch::pytorch
  - pytorch::pytorch-cuda=12.4
  - pytorch::torchvision
  - pytorch::torchaudio
  - pandas
  - pip:
      - realesrgan
      - opencv-python
      - scikit-image
      - matplotlib
      - pillow
      - pyyaml
      - tqdm
