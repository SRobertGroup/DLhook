name: dlhook_env
channels:
  - nvidia
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - cudatoolkit=11.8  # Match this with your GPU driver version
  - pytorch
  - torchvision
  - torchaudio
  - pandas
  - pip:
      - realesrgan
      - opencv-python
      - scikit-image
      - matplotlib
      - pillow
