# DLhook environment. Create it from the repository root (the pip section reads requirements.txt):
#   mamba env create -f env.yaml
#
# PyTorch comes from the PyTorch wheel index (CUDA 12.8). The conda `pytorch` channel stopped at
# 2.5, which cannot drive recent GPUs (Blackwell, sm_120), so conda no longer provides it. For an
# older driver change `cu128` below to `cu126`; for CPU only, delete the --extra-index-url line.
# Versions are pinned in requirements.txt; requirements-lock.txt pins every package.
name: dlhook_env
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - -r requirements.txt
