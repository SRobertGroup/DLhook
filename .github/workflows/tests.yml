name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # OpenCV's cv2 needs libGL / libglib at import time on a bare runner
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      # The suite needs no GPU and no image data, so use the small CPU wheels
      - name: Install CPU PyTorch
        run: pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Check Tk is importable
        run: python -c "import tkinter; print('tk', tkinter.TkVersion)"

      - name: Run tests
        run: python -m pytest -q
